<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F5F1">
  <title>音符よみ練習</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
  <link rel="stylesheet" href="/src/styles/common.css" />
  <link rel="stylesheet" href="/src/styles/piano-test.css" />
</head>

<body>
  <main class="sheet">
    <header class="top">
      <h1>音符よみ練習</h1>
      <div class="top-actions">
        <a class="nav-link" href="index.html">音名クイズ</a>
        <a class="nav-link" href="note-map.html">音の位置一覧</a>
        <button class="toggle" id="sound" type="button" aria-pressed="true">音：オン</button>
      </div>
    </header>

    <div class="modebar">
      <div class="modes" id="modes" role="radiogroup" aria-label="出題モード">
        <button class="mode" type="button" role="radio" data-mode="treble">ト音記号</button>
        <button class="mode" type="button" role="radio" data-mode="bass">ヘ音記号</button>
        <button class="mode" type="button" role="radio" data-mode="mix">まぜる</button>
      </div>
      <div class="accs" role="group" aria-label="調号">
        <span class="accs-label" aria-hidden="true">調号</span>
        <button class="acc-toggle" type="button" data-acc="sharp" aria-pressed="false" aria-label="♯の調号を出す">♯</button>
        <button class="acc-toggle" type="button" data-acc="flat" aria-pressed="false" aria-label="♭の調号を出す">♭</button>
      </div>
    </div>

    <div class="status">
      <ol class="answers" id="answers" aria-label="解答欄"></ol>
      <p class="timer" id="timer" aria-label="経過時間">0.0秒</p>
    </div>

    <section class="stage">
      <svg id="staff" role="img" aria-label="五線譜"></svg>
      <p class="msg" id="msg" aria-live="polite"></p>
      <div class="result" id="result" hidden></div>
    </section>

    <div class="keys" id="keys" role="group" aria-label="答えを選ぶ" hidden></div>
    <button class="action" id="action" type="button">スタート</button>
    <p class="hint" id="hint"></p>
  </main>

  <script type="module" src="/src/piano-test.ts"></script>
</body>

</html>
