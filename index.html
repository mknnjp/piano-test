<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>悲愴ソナタ 第2楽章 音名クイズ</title>
  <link rel="stylesheet" href="/src/styles/common.css" />
  <link rel="stylesheet" href="/src/styles/quiz.css" />
</head>

<body>
  <main class="container">
    <h1>悲愴ソナタ 第2楽章 音名クイズ</h1>
    <p class="subtitle">
      五線譜に表示された単音の音名を答えてください。調号は変イ長調（♭×4）を前提とし、
      臨時記号がある場合は譜面表記どおりに判定します（同音異名は不正解）。
    </p>
    <p class="subtitle">
      <a href="note-map.html">ト音記号・ヘ音記号の音の位置一覧を見る</a>
    </p>

    <section class="score-card">
      <div class="staff-panel">
        <svg id="staff" width="100%" height="180" viewBox="0 0 360 180" aria-label="五線譜" role="img"></svg>
      </div>
      <div class="question-meta">
        <div>
          <div class="label">現在の問題</div>
          <div class="value" id="question-index">—</div>
        </div>
        <div>
          <div class="label">ヒント</div>
          <div class="value" id="clef-label">—</div>
          <div class="note-info">※ オクターブは判定に含まれません。</div>
        </div>
      </div>
    </section>

    <section class="buttons" id="answer-buttons"></section>

    <div class="status" id="status"></div>

    <div class="actions">
      <button class="next-button" id="next-button">次の問題</button>
    </div>
  </main>

  <script type="module" src="/src/quiz.ts"></script>
</body>

</html>
